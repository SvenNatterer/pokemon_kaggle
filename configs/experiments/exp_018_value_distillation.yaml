# EXP-018: Value Function Distillation (1-Step Lookahead)
deck: decks/deck_bank/bank_38.csv
model_name: models/ppo_v6_exp018_value_distillation.zip
algorithm: PPO
learning_rate: 0.0001
n_steps: 512
batch_size: 1024
n_epochs: 2
gamma: 0.999
gae_lambda: 0.95
clip_range: 0.12
ent_coef: 0.008
opp_pool: decks/pools/kaggle_rule_bots_dev_pool.json

# Lookahead Teacher Distillation Parameters
distill_coef: 0.1
value_distill_coef: 0.1
teacher_sample_rate: 0.05
lookahead:
  max_depth: 1
  beam_width: 2
  node_budget: 8
  max_combinations: 16
