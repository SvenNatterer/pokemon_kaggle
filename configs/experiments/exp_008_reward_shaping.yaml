# EXP-008: Reward Shaping (Timing Penalty & Anti-Deck-Out Protection) (1M Timesteps)
model_name: models/ppo_v6_exp008_reward_shaping.zip
opp_pool: decks/pools/kaggle_rule_bots_dev_pool.json
algorithm: PPO
total_timesteps: 1000000
learning_rate: 0.0001
n_steps: 512
batch_size: 1024
n_epochs: 2
gamma: 0.999
gae_lambda: 0.95
clip_range: 0.12
ent_coef: 0.008
aux_coef: 0.1
distill_coef: 0.1
teacher_sample_rate: 0.05

lookahead:
  max_depth: 1
  beam_width: 2
  node_budget: 8
  max_combinations: 16

rewards:
  STEP_PENALTY: -0.001
  DECK_OUT_PENALTY: -0.50
  DECK_SHRINK: -0.005
  DECK_LOW_COUNT_MULT: 4.0
  PRIZE_WIN: 1.0
  LOSS: -1.0
  PRIZE_TAKEN: 0.005
  PRIZE_LOST: -0.005
  DAMAGE_DEALT: 0.00005
  DAMAGE_TAKEN: -0.00005
