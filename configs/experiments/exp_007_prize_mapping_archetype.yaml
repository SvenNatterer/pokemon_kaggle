# EXP-007: Prize Mapping & Opponent Archetype Strategy Prediction (1M Timesteps - TR Mewtwo bank_38)
deck: decks/deck_bank/bank_38.csv
model_name: models/ppo_v6_exp007_bank38_tr_mewtwo.zip
opp_pool: decks/pools/kaggle_rule_bots_dev_pool.json
algorithm: PPO
total_timesteps: 1000000
learning_rate: 0.0001
n_steps: 512
batch_size: 1024
n_epochs: 2
gamma: 0.999
gae_lambda: 0.95
clip_range: 0.12
ent_coef: 0.008
aux_coef: 0.1
distill_coef: 0.1
teacher_sample_rate: 0.05

features:
  prize_mapping: true
  archetype_prediction: true
  wandb_logging: true

lookahead:
  max_depth: 1
  beam_width: 2
  node_budget: 8
  max_combinations: 16
