# EXP-029: fresh Grimmsnarl ex V3 policy for the training-only opponent league.
deck: decks/deck_bank/deck_grimmsnarl_ex_kaggle.csv
model_name: models/training_v6/ppo_v6_grimmsnarl_ex_strategic_vector_v3_pfsp_2m_seed11.zip
opp_pool: decks/pools/default_training.json
total_timesteps: 2000000
learning_rate: 0.0001
n_steps: 512
batch_size: 1024
n_epochs: 2
clip_range: 0.12
target_kl: 0.03
ent_coef: 0.008
num_envs: 4
torch_threads: 0
seed: 11

# Latest public-information observation contract.
scalar_obs: true
feature_variant: strategic_vector_v3
aux_coef: 0.0
distill_coef: 0.0
value_distill_coef: 0.0
enable_lookahead_teacher: false
teacher_sample_rate: 0.0
belief_actor: false
card_table: false
inference_guardrails: true
inference_guardrail_mode: active
search_guardrail_rate: 0.0
enable_archetype_prediction: true
extra_metrics: true
wandb_mode: online
sparse_rewards: true

# Training-only PFSP-lite and telemetry.  The evaluation interval deliberately
# exceeds this run so the frozen final holdout is not consumed during training.
pfsp_update_steps: 250000
pfsp_window_games: 150
checkpoint_eval_steps: 3000000
checkpoint_eval_games_per_opponent: 50
