# EXP-016 Stage 3: Evolving Self-Play League Training (+2M steps to 4M total steps, Nighttime Mode)
deck: decks/deck_bank/bank_38.csv
model_name: models/ppo_v6_exp016_4m_pfsp_league.zip
base_model: models/ppo_v6_exp016_2m_pfsp_league.zip
opp_pool: decks/pools/exp016_selfplay_league_pool_stage3.json
algorithm: PPO
total_timesteps: 2000000
learning_rate: 0.00025
n_steps: 512
batch_size: 2048
n_epochs: 2
gamma: 0.999
gae_lambda: 0.95
clip_range: 0.12
ent_coef: 0.008
aux_coef: 0.1
distill_coef: 0.0
enable_lookahead_teacher: false
teacher_sample_rate: 0.0
num_envs: 4
torch_threads: 0
inference_guardrails: true

features_dim: 512
hidden_dim: 256
net_arch: [512, 512]
activation: LayerNorm_ReLU

attention:
  enabled: true
  embedding_dim: 64
  n_heads: 4

features:
  disable_cpp_relations: true
  prize_mapping: true
  archetype_prediction: true
  wandb_logging: true

rewards:
  STEP_PENALTY: -0.001
  DECK_OUT_PENALTY: -0.50
  DECK_SHRINK: -0.005
  DECK_LOW_COUNT_MULT: 4.0
