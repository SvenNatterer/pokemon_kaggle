# EXP-010: Baseline FPS Benchmark without Teacher (4 Workers, 50k Steps)
deck: decks/deck_bank/bank_38.csv
model_name: models/ppo_v6_exp010_baseline_fps.zip
opp_pool: decks/pools/kaggle_rule_bots_dev_pool.json
algorithm: PPO
total_timesteps: 50000
learning_rate: 0.0001
n_steps: 512
batch_size: 2048
n_epochs: 1
gamma: 0.999
gae_lambda: 0.95
clip_range: 0.12
ent_coef: 0.008
aux_coef: 0.1
distill_coef: 0.0
teacher_sample_rate: 0.0
enable_lookahead_teacher: false
num_envs: 4

features_dim: 256
hidden_dim: 128

features:
  prize_mapping: true
  archetype_prediction: true
  wandb_logging: true

lookahead:
  max_depth: 1
  beam_width: 2
  node_budget: 8
  max_combinations: 16

rewards:
  STEP_PENALTY: -0.001
  DECK_OUT_PENALTY: -0.50
  DECK_SHRINK: -0.005
  DECK_LOW_COUNT_MULT: 4.0
